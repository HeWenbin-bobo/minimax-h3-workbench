name: build-desktop-release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  package:
    needs: test
    strategy:
      matrix:
        include:
          - os: windows-latest
            command: npm run package:win
          - os: macos-15
            command: npm run package:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: release/*

  # 推送 v* 标签时触发：在 Windows runner 上构建并发布到 GitHub Releases。
  # electron-updater 依赖 Release 附件里的 latest.yml（electron-builder 自动生成）做应用内更新。
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # electron-builder 只向 draft Release 上传资产：预建 draft 避免并发上传竞态
      # （同 tag 重复建 Release 导致资产拆分到两个对象）。发布状态由维护者手动转正。
      - name: Pre-create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" 2>/dev/null && exit 0
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft \
            --title "MiniMax H3 工作台 $GITHUB_REF_NAME" \
            --notes "自动构建发布。下载 setup exe 安装，老版本用户会在应用内收到更新提示。"
      - run: npm run release:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
